name: Kenbi
description: 'Kenbi is a German healthcare organization focused on nursing education and workforce
  development, operating through two divisions. Kenbi Academy delivers continuing professional
  development for care workers with 100+ ZFU-certified courses recognized by all German health
  insurers and available nationwide, spanning nursing service management, quality assurance, wound
  care, and instructor training. Kenbi Campus runs vocational nursing programs in Berlin and Hamburg,
  including a three-year registered nurse generalist program and an 18-month nursing assistant
  curriculum. Originally surfaced as a portfolio company of Partech and added to the API Evangelist
  network for enrichment; no public developer program, API, or documentation surface was found.'
